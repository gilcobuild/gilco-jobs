<style>
/* Layout: phone-first app shell; top bar, one scrolling view, bottom tab bar; editors open as full-height sheets */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --fg:#17212b; --muted:#5a6672; --line:#d9dfe5;
  --accent:#d9631e; --accent-soft:#fbe9dd; --ink:#1f3a56; --ink-soft:#e3ebf3;
  --good:#2f7d4f; --good-soft:#e2f2e8; --warn:#9a6a00; --warn-soft:#fbf1d6; --bad:#b3362c; --bad-soft:#f9e1de;
  --desk:#dde3e9;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --fg:#e6ebf0; --muted:#9aa6b2; --line:#2c3846;
  --accent:#f0874a; --accent-soft:#3a2516; --ink:#9cc0e4; --ink-soft:#1d2c3c;
  --good:#6fcf97; --good-soft:#173024; --warn:#e6bd5c; --warn-soft:#332a12; --bad:#f08a80; --bad-soft:#3a1d1a; --desk:#080b0e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --fg:#e6ebf0; --muted:#9aa6b2; --line:#2c3846;
  --accent:#f0874a; --accent-soft:#3a2516; --ink:#9cc0e4; --ink-soft:#1d2c3c;
  --good:#6fcf97; --good-soft:#173024; --warn:#e6bd5c; --warn-soft:#332a12; --bad:#f08a80; --bad-soft:#3a1d1a; --desk:#080b0e; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:880px;margin:0 auto;padding-block:10px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.logo{font:700 20px var(--f-display);letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:10px;height:22px;background:var(--accent);border-radius:2px}
select,input,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;box-sizing:border-box}
textarea{min-height:70px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.45;font-style:italic;font-weight:400}
.top select{width:auto;max-width:62%;min-width:0;padding:6px 8px;font-size:13px;text-overflow:ellipsis}
main{max-width:880px;margin:0 auto;padding-block:16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:28px} h2{font-size:21px} h3{font-size:17px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.ink{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px;text-align:left}
.tile b{font:500 20px var(--f-mono);font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--muted)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;text-align:left;width:100%}
.card:last-child{border-bottom:0}
.card .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.card .s{grid-column:1;color:var(--muted);font-size:13px;min-width:0;overflow-wrap:anywhere}
.card .r{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{font:600 11px var(--f-body);padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--ink-soft);color:var(--ink)}
.pill.Approved,.pill.Paid,.pill.Done{background:var(--good-soft);color:var(--good)}
.pill.Sent,.pill.Scheduled{background:var(--warn-soft);color:var(--warn)}
.pill.Declined,.pill.Overdue{background:var(--bad-soft);color:var(--bad)}
.pill.InProgress,.pill.PunchList{background:var(--accent-soft);color:var(--accent)}
.pill.vok{background:var(--good-soft);color:var(--good)}.pill.vbad{background:var(--warn-soft);color:var(--warn)}
.vrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:end;margin:6px 0 10px}.vrow .chk2{display:flex;gap:8px;align-items:center;font-weight:600;min-height:44px}.vrow .chk2 input{width:20px;height:20px}.vrow .f{min-width:150px}.vrow .f.src{flex:1;min-width:200px}
.vnote{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:3px 8px;margin-top:4px}
.brand{font:500 10.5px var(--f-mono);letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.empty{padding:22px 16px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg button{border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.board{display:grid;gap:12px}
@media (min-width:760px){.board{grid-template-columns:repeat(4,minmax(0,1fr))}}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{display:flex;justify-content:space-between}
.tabs{border-top:1px solid var(--line)}
.tabs-in{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;border-radius:0;background:none;padding:8px 2px 8px;border-bottom:3px solid transparent;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.sheet-top{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-top .in{max-width:760px;margin:0 auto;padding-block:10px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.sheet-body{max-width:760px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
.fields{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fields .full{grid-column:1/-1}
@media (max-width:520px){.fields{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px}
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 70px 100px 34px;gap:8px;align-items:end;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.line .opt{grid-column:1/-1;display:flex;gap:14px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.line .opt label{display:flex;gap:6px;align-items:center}
.line .opt input{width:18px;height:18px;accent-color:var(--accent)}
.line .amt{grid-column:1/-1;text-align:right;font-size:13px}
.line.off{opacity:.55}
.x{padding:8px 0;width:34px}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14px}
.totals .big{font:600 18px var(--f-mono);border-top:1px solid var(--line);padding-top:6px}
.totals .bigl{font-weight:600;border-top:1px solid var(--line);padding-top:6px}
.pick{max-height:300px;overflow-y:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600}
.notice{background:var(--warn-soft);color:var(--fg);border-radius:8px;padding:12px 14px;font-size:14px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
/* phone layout: tab bar at the bottom (real phones, and the iPhone preview) */
.mob .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.mob .tabs button{border-bottom:0;padding:9px 2px 10px}
.mob main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.mob .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
/* preview switch, computer only */
.viewbar{max-width:880px;margin:0 auto;padding-block:12px 0;display:flex;justify-content:flex-end;gap:10px;align-items:center}
.mob:not(.frame) .viewbar{display:none}
.frame .viewbar{justify-content:center;padding-block:16px 0}
.island,.homebar{display:none}
/* iPhone frame */
.frame body{background:var(--desk)}
.frame .shell{width:390px;max-width:calc(100% - 32px);height:min(844px,calc(100vh - 110px));margin:16px auto 24px;border:12px solid #0d0f12;border-radius:54px;overflow-y:auto;overflow-x:hidden;transform:translateZ(0);background:var(--bg);box-shadow:0 0 0 2px #3a3f46,0 24px 60px rgba(0,0,0,.28);scrollbar-width:none}
.frame .shell::-webkit-scrollbar{display:none}
.frame .shell{overflow:hidden;display:flex;flex-direction:column}.frame .shell>.top{flex:none}.frame .shell>main{flex:1 1 auto;min-height:0;overflow-y:auto;width:100%;max-width:none;box-sizing:border-box;scrollbar-width:none}.frame .shell>main::-webkit-scrollbar{display:none}
.frame .island{display:block;position:fixed;top:10px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#0d0f12;z-index:70}
.frame .homebar{display:block;position:fixed;bottom:7px;left:50%;transform:translateX(-50%);width:132px;height:5px;border-radius:3px;background:var(--fg);opacity:.75;z-index:70}
.frame .top{padding-top:50px}
.frame .sheet{padding-top:50px}
.frame .tabs{padding-bottom:22px}
.frame main{padding-bottom:110px}
.frame .toast{bottom:100px}
.frame .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.frame .board{grid-template-columns:minmax(0,1fr)}
.frame .fields{grid-template-columns:minmax(0,1fr)}
.chk{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.line.tier{border-left:3px solid var(--accent);padding-left:10px}
.line{grid-template-columns:minmax(0,1fr) 34px}
.line .nums{grid-column:1/-1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.igrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.igrid>.s1x{grid-column:span 1}
.igrid>.s2{grid-column:span 2}.igrid>.s3{grid-column:span 3}.igrid>.s4{grid-column:span 4}.igrid>.s6{grid-column:span 6}
@media (max-width:560px){.igrid>.p2{grid-column:span 2}.igrid>.p4{grid-column:span 4}.igrid>.p6{grid-column:span 6}}
.frame .igrid>.p2{grid-column:span 2}.frame .igrid>.p4{grid-column:span 4}.frame .igrid>.p6{grid-column:span 6}
.ptable,.ttable{display:grid;grid-template-columns:96px repeat(3,minmax(0,1fr));gap:8px 10px;align-items:center}
.ph{font-size:12px;font-weight:600;color:var(--muted)}
.pl{font-weight:600;font-size:14px}
.ps{padding-left:2px;font-size:14px}
.mktable{display:grid;gap:6px 10px;align-items:center;max-width:420px}.mktable.one{grid-template-columns:minmax(0,1fr) 96px}.mktable.two{grid-template-columns:minmax(0,1fr) 96px 96px}.mktable input{min-height:40px;padding:6px 10px;text-align:right}.mktable .ph{text-align:right;font-size:12px}
.ptable .pl,.mktable .pl{font-size:13.5px}
.ttable .tdesc,.ttable .tprofit{grid-column:2/-1}
.ttable .tsup{grid-column:2/-1}
.ttable .tmfr{grid-column:2/4}
.ttable .tmodel{grid-column:4}
.ttable{grid-template-columns:60px repeat(3,minmax(0,1fr))}
.ttable .tprofit{margin-bottom:6px}
details.box>summary{cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;list-style-position:outside}
details.box[open]>summary{margin-bottom:4px}
details.box>summary::-webkit-details-marker{display:none}

details.box[open]>summary::after{content:"Hide"}
.mkbox summary{cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.mkbox[open] summary{margin-bottom:10px}.mkbox:not([open]){padding-block:10px}
.bulk{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 40%,var(--surface))}
.card.hasimg{grid-template-columns:56px minmax(0,1fr) auto}
.card .thumb{grid-row:1/3;grid-column:1;width:56px;height:56px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
div.thumb{display:grid;place-items:center;color:var(--muted);font-size:10px}
.card.hasimg .t,.card.hasimg .s{grid-column:2}.card.hasimg .r{grid-column:3}
.locrow{display:grid;grid-template-columns:auto 1.2fr 2fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px}@media (max-width:700px){.locrow{grid-template-columns:1fr 1fr}.locrow>*{min-width:0}}
.sheet-body[data-isec="main"]>.sec{display:none}
.sheet-body[data-isec="pricing"]>:not(.sec-pricing),.sheet-body[data-isec="gbb"]>:not(.sec-gbb),.sheet-body[data-isec="labor"]>:not(.sec-labor){display:none!important}
.sheet-body[data-isec]:not([data-isec="main"])>details.sec>summary{display:none}
.secnav{display:flex;flex-direction:column;gap:10px}
.navbtn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 16px;min-height:64px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.navbtn .sb{display:flex;flex-direction:column;gap:2px;min-width:0}.navbtn .chev{font-size:26px;color:var(--muted)}



.calnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.calnav button{min-height:44px;min-width:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:16px}.calnav b{margin-left:6px;font-family:var(--f-display);font-size:20px}
.tray{background:var(--warn-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}.trayl{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}.trayl .jchip{min-width:180px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:start}
.cday{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:140px;min-width:0}
.cday.today{border-color:var(--accent)}.cdh{font-weight:600;font-size:13px;color:var(--muted)}.cday.today .cdh{color:var(--accent)}.cempty{padding:6px 2px}
.jchip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;width:100%;min-height:52px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);border-left:5px solid var(--ink);background:var(--bg);color:var(--fg)}
.jchip .jt{font-weight:600;font-size:14px;line-height:1.25}.jchip .js{font-size:12px;color:var(--muted)}
.b-me{border-left-color:#d9631e}.b-hs{border-left-color:#2f7d4f}.b-gc{border-left-color:#1f3a56}.b-el{border-left-color:#9a6a00}.b-pl{border-left-color:#3a6fb3}
.daystrip{display:none;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.daystrip button{display:flex;flex-direction:column;align-items:center;gap:0;min-height:62px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:12px;padding:4px 0}
.daystrip button b{font-size:20px;font-family:var(--f-display)}.daystrip button i{font-style:normal;font-size:11px;color:var(--accent);font-weight:700;min-height:14px}
.daystrip button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}.daystrip button[aria-pressed="true"] i{color:var(--surface)}.daystrip button.today:not([aria-pressed="true"]){border-color:var(--accent)}
.mob .daystrip,.frame .daystrip{display:grid}.mob .cal,.frame .cal{grid-template-columns:minmax(0,1fr)}.mob .cday:not(.sel),.frame .cday:not(.sel){display:none}.mob .cday .cdh{font-size:15px}

.dgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.dgrid button{min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.dgrid button small{font-size:10px;font-weight:600;color:var(--muted)}.dgrid button.past{opacity:.45}.dgrid button.today{border-color:var(--accent)}
.dgrid button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}.dgrid button[aria-pressed="true"] small{color:#fff}
.bigseg{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px}.bigseg button,.crewb button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:16px}

.crewb{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pv-reb{background:var(--good-soft);color:var(--good);border-radius:10px;padding:8px 10px;font-weight:600;font-size:14px;display:flex;flex-direction:column}.pv-reb span{font-weight:500;font-size:13px}

.phbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

function decodeUnit(model,serial,brandPick,tonsPick){

function mfrList(){return [...new Set([...S.data.pricebook.flatMap(p=>[p.mfr,...(p.tiers||[]).map(t=>t.mfr)]).filter(Boolean),...MFRS])]}
function defMk(kind){if(kind==="mat")return defMarkup();const m=S.pricing&&S.pricing[kind+"Markup"];return blank(m)?defMarkup():Number(m)}
function defLabMarkup(){return defMk("lab")}
function divMk(div,kind){const dm=((S.pricing&&S.pricing.divMarkups)||{})[div]||{};const v=dm[kind];return blank(v)?defMk(kind):Number(v)}
/* Price Book items: material, labor, equipment, permits, delivery/disposal, each with its own markup. Older items had one cost. */
function normItem(o){
  if(o.matCost===undefined&&o.labCost===undefined){o.matCost=blank(o.cost)?"":num(o.cost);o.labCost="";if(o.matMarkup===undefined)o.matMarkup=blank(o.markup)?"":o.markup;if(o.labMarkup===undefined)o.labMarkup=""}
  return o;
}
function itemCost(o){return r2(COMPS.reduce((a,[k])=>a+num(o[k+"Cost"]),0))}
function itemPrice(o,m){m=m||o;return r2(COMPS.reduce((a,[k])=>a+num(o[k+"Cost"])*(1+num(m[k+"Markup"])/100),0))}
function costTotal(doc){return r2((doc.items||[]).filter(lineOn).reduce((a,l)=>a+(Number(l.qty)||0)*(Number(l.cost)||0),0))}
function extrasCost(it){return r2(EXTRAS.reduce((a,k)=>a+num(it[k+"Cost"]),0))}
/* a Good/Better/Best tier has its own material and labor; equipment, permits and delivery come from the item */
function tierCosts(t,it){const o={matCost:t.matCost??t.cost,labCost:t.labCost};EXTRAS.forEach(k=>o[k+"Cost"]=it[k+"Cost"]);return o}
/* keep an item's (or a tier's) price in step; k is the field just typed; m holds the markups */
function syncItem(o,k,m){
  m=m||o;
  if(/Cost$/.test(k))COMPS.forEach(([c])=>{if(blank(m[c+"Markup"]))m[c+"Markup"]=divMk(m.division||"Other",c)});
  const costs=o===m?o:tierCosts(o,m);
  if(k==="price"){
    if(o===m){const p=num(o.price),sell=c=>num(o[c+"Cost"])*(1+num(m[c+"Markup"])/100);
      const notMat=COMPS.filter(([c])=>c!=="mat").reduce((a,[c])=>a+sell(c),0);
      if(num(o.matCost)>0)m.matMarkup=Math.round(((p-notMat)/num(o.matCost)-1)*1000)/10;
      else if(num(o.labCost)>0)m.labMarkup=Math.round(((p-(notMat-sell("lab")))/num(o.labCost)-1)*1000)/10;}
  } else if(itemCost(costs)>0)o.price=itemPrice(costs,m);
  o.cost=itemCost(costs);o.markup=calcMarkup(o.cost,o.price);
}
/* quote lines: material + labor + other (equipment, permits, delivery) with one markup */
function syncPrice(o,k){
  const parts=["matCost","labCost","othCost"];
  if(parts.includes(k))o.cost=r2(num(o.matCost)+num(o.labCost)+num(o.othCost));
  if((k==="cost"||parts.includes(k))&&blank(o.markup)&&defMarkup()!=="")o.markup=defMarkup();
  if(["cost","markup",...parts].includes(k)){if(num(o.cost)>0&&!blank(o.markup))o.price=calcPrice(o.cost,o.markup)}
  else if(k==="price")o.markup=calcMarkup(o.cost,o.price);
}
function profitLine(o){const c=Number(o.cost)||0,p=Number(o.price)||0;return c&&p?`Profit ${money(p-c)} per ${o.unit==="ls"?"job":(!o.unit||o.unit==="ea")?"item":unitLabel(o.unit)} · ${calcMarkup(c,p)}% overall markup · ${marginPct(c,p)}% margin`:"Enter your costs to see profit and margin."}
const instName=id=>(S.installers.find(x=>x.id===id)||{}).name||"";
function subPriceText(s,d){const c=num(s.cost);if(!c)return "";return `labor ${money(c)} → price ${money(itemPrice({...d,labCost:c},d))}`}
function lineDefaultLab(l,p){if(l.group){const t=(p.tiers||[]).find(t=>t.tier===l.tier);return num(t&&t.labCost)}return num(normItem({...p}).labCost)}
function lineBase(l,p){const it=normItem({...p});return l.group?tierCosts((p.tiers||[]).find(t=>t.tier===l.tier)||{},it):{...it}}
function installerOpts(l){
  const p=l.pbId&&byId("pricebook",l.pbId);
  return [["",p?`Default labor — ${money(lineDefaultLab(l,p))}`:"Not set"],...S.installers.map(i=>{const sc=p&&(p.subCosts||[]).find(s=>s.installer===i.id);return [i.id,i.name+(sc?` — labor ${money(sc.cost)}`:"")]})];
}
function applyInstallerCost(l){
  const p=l.pbId&&byId("pricebook",l.pbId);if(!p)return;
  const sc=(p.subCosts||[]).find(s=>s.installer===l.installer);
  if(l.installer&&!sc){toast(`No labor saved for ${instName(l.installer)} on this item. Enter it on the line or in the Price Book.`);return}
  if(l.matCost===undefined){l.matCost=num(l.cost);l.labCost=0}
  l.labCost=sc?num(sc.cost):lineDefaultLab(l,p);
  l.cost=r2(num(l.matCost)+num(l.labCost)+num(l.othCost));
  if(instMode()==="price"&&num(l.price)>0)l.markup=calcMarkup(l.cost,l.price);
  else{const it=normItem({...p});l.price=itemPrice({...lineBase(l,p),matCost:l.matCost,labCost:l.labCost},it);l.markup=calcMarkup(l.cost,l.price)}
}
function instMode(){return (S.draft&&S.draft.instMode)||S.pricing.instMode||"markup"}
function lineProfitHtml(l){
  const c=Number(l.cost)||0;if(!c)return "";
  const q=Number(l.qty)||0,pr=r2((Number(l.price)-c)*q);let diff="";
  const p=l.pbId&&byId("pricebook",l.pbId);
  if(p&&l.installer){
    const it=normItem({...p}),dl=lineDefaultLab(l,p),dc=r2(num(l.matCost)+dl+num(l.othCost));
    const defProfit=instMode()==="price"?r2((num(l.price)-dc)*q):r2((itemPrice({...lineBase(l,p),matCost:l.matCost,labCost:dl},it)-dc)*q);
    const df=r2(pr-defProfit);
    if(df)diff=` <span class="${df>0?"up":"down"}">${df>0?"+":"−"}${money(Math.abs(df))} vs default</span>`;
  }
  return `<span class="priv">Profit ${money(pr)}${diff}</span> · `;
}
const VERIFY_DAYS=30;
function daysSince(d){return d?Math.floor((Date.now()-new Date(d+"T12:00:00").getTime())/864e5):null}
function vRefresh(d){const c=$("#f-costDate");if(c&&c.value!==(d.costDate||""))c.value=d.costDate||"";const v=$("#f-verified");if(v)v.checked=isVerified(d);const st=$("#f-vstat");if(st)st.textContent=hasMat(d)&&!isVerified(d)?verifyText(d):(isVerified(d)?`Verified — current as of ${fmtDate(d.costDate)}.`:`Prices older than ${VERIFY_DAYS} days get flagged to verify.`)}
function hasMat(p){return num(p.matCost)>0||num(p.eqpCost)>0||(p.tiers||[]).some(t=>num(t.matCost??t.cost)>0)}
function isVerified(p){const n=daysSince(p.costDate);return n!==null&&n<=VERIFY_DAYS}
function needsVerify(p){return hasMat(p)&&!isVerified(p)}
function verifyText(p){const n=daysSince(p.costDate);if(n===null)return "Material price has no date — verify it";return `Material price is from ${fmtDate(p.costDate)} (${n} day${n===1?"":"s"} old) — verify it`}
function verifyBadge(p){if(!hasMat(p))return "";return isVerified(p)?`<span class="pill vok" title="Material price current as of ${esc(fmtDate(p.costDate))}">Verified ${esc(fmtDate(p.costDate).replace(/, \d{4}$/,""))}</span>`:`<span class="pill vbad" title="${esc(verifyText(p))}">Verify price</span>`}
function tierRange(p){const ps=(p.tiers||[]).map(t=>Number(t.price)||0);return ps.length?[Math.min(...ps),Math.max(...ps)]:null}
function totals(doc){
  const sub=r2((doc.items||[]).filter(lineOn).reduce((a,l)=>a+lineAmt(l),0));
  const tax=r2(sub*(Number(doc.taxRate)||0)/100);
  return {sub,tax,total:r2(sub+tax)};
}
function invPaid(inv){return inv.status==="Paid"}
function invOverdue(inv){return inv.status==="Sent"&&inv.dueDate&&inv.dueDate<today()}
function jobValue(job){
  const q=job.quoteId&&byId("quotes",job.quoteId);
  const base=q?totals(q).total:0;

/* ---------- storage ---------- */
async function save(col,obj){
  if(!S.db){ // not connected: keep it working for this visit
    const id=obj.id||("local"+Date.now()+Math.random().toString(36).slice(2,6));
    const body={...obj,id,updatedAt:new Date().toISOString()};if(!body.createdAt)body.createdAt=body.updatedAt;
    const i=S.data[col].findIndex(x=>x.id===id);if(i>=0)S.data[col][i]=body;else S.data[col].push(body);
    obj.id=id;return id;
  }
  const id=obj.id||S.db.collection(col).doc().id;
  const body={...obj};delete body.id;
  body.updatedAt=new Date().toISOString();
  if(!body.createdAt)body.createdAt=body.updatedAt;
  try{await S.db.collection(col).doc(id).set(body);obj.id=id;return id}
  catch(e){toast(e?.code==="invalid_argument"?"You can view but not change this":"Couldn't save. Try again.");return false}
}
async function remove(col,id){
  if(!S.db){S.data[col]=S.data[col].filter(x=>x.id!==id);return true}
  try{await S.db.collection(col).doc(id).delete();return true}catch(e){toast("Couldn't delete. Try again.");return false}
}

function pickItems(){
  const b=S.draft.brand,q=S.pkQ.toLowerCase();

  if(!all.length)return `<div class="empty">Price Book is empty. Add items from Home → Price Book.</div>`;
  const items=all.filter(p=>(S.pkSub==="All"||p.sub===S.pkSub)&&(!q||[p.name,p.desc,p.division,p.sub,p.mfr,...(p.tiers||[]).map(t=>t.mfr)].join(" ").toLowerCase().includes(q))).sort((x,y)=>(x.division||"Other").localeCompare(y.division||"Other")||(x.sub||"~").localeCompare(y.sub||"~")||x.name.localeCompare(y.name,undefined,{numeric:true})).slice(0,120);

function pickList(){

/* ---------- Jobber import ---------- */
const jbId=id=>"jb-"+String(id).replace(/\//g,"_").replace(/[^A-Za-z0-9_\-.~:@+]/g,"");
function clientFromJobber(c,brand){
  const a=c.billingAddress||{};
  const cityLine=[a.city,[a.province,a.postalCode].filter(Boolean).join(" ")].filter(Boolean).join(", ");
  const addr=[a.street1,a.street2,cityLine].map(x=>(x||"").trim()).filter(x=>x&&x!=="TBA").join(", ");
  const now=new Date().toISOString();
  return {name:(c.name||c.companyName||"Unnamed").replace(/\s+/g," ").trim(),phone:c.phone||"",email:c.email||"",address:addr,brand,
    company:c.companyName||"",notes:c.isLead?"Lead in Jobber":"",jobberId:c.id,source:"jobber",createdAt:c.createdAt||now,updatedAt:now};
}
function itemFromJobber(p){
  const now=new Date().toISOString();
  return {name:(p.name||"Unnamed").trim(),desc:p.description||"",division:guessDivision(p),unit:"ea",price:Number(p.defaultPrice)||0,matCost:Number(p.internalCost)||0,labCost:0,cost:Number(p.internalCost)||0,matMarkup:Number(p.markup)>0?Math.round(Number(p.markup)*10)/10:calcMarkup(p.internalCost,p.defaultPrice),labMarkup:"",markup:Number(p.markup)>0?Math.round(Number(p.markup)*10)/10:calcMarkup(p.internalCost,p.defaultPrice),brand:"",
    jobberId:p.id,source:"jobber",createdAt:now,updatedAt:now};
}
async function writeAll(col,pairs,progress){
  let i=0,done=0;
  async function worker(){
    while(i<pairs.length){
      const [id,body]=pairs[i++];let ok=false,last;
      for(let t=0;t<4&&!ok;t++){
        try{await S.db.collection(col).doc(id).set(body);ok=true}
        catch(e){last=e;if(e?.code==="resource_exhausted"||e?.code==="unavailable")await new Promise(r=>setTimeout(r,1500*(t+1)+Math.random()*500));else throw e}
      }
      if(!ok)throw last;
      done++;if(done%10===0||done===pairs.length)progress(done);
    }
  }
  await Promise.all([worker(),worker(),worker()]);
}
async function readAll(mcp,tool,key,limit,progress){
  let cursor=null,out=[],pages=0;
  do{
    const input=cursor?{limit,cursor}:{limit};
    let r;
    try{r=await mcp.callTool("Jobber",tool,input)}
    catch(e){if(e?.retryable){await new Promise(res=>setTimeout(res,e.retryAfterMs||2500));r=await mcp.callTool("Jobber",tool,input)}else throw e}
    const p=r.payload||{};out.push(...(p[key]||[]));progress(out.length);
    cursor=p.pageInfo&&p.pageInfo.hasNextPage?p.pageInfo.endCursor:null;pages++;
  }while(cursor&&pages<200);
  return out;
}
function importErr(e){
  const m={server_not_connected:"Jobber isn't connected to your Claude account. Add it in claude.ai Settings → Connectors, then try again.",
    needs_reauth:"Your Jobber connection needs to be renewed. Reconnect Jobber in claude.ai Settings → Connectors, then try again.",
    not_in_manifest:"Jobber access is turned off for Gilco Jobs. Tap Start Import and choose Allow when asked.",
    approval_required:"Gilco Jobs needs your OK to read Jobber. Tap Start Import and choose Allow when asked.",
    selection_required:"You have more than one Jobber connection. Pick one when asked, then try again.",
    server_unavailable:"Jobber didn't answer. Wait a minute and try again; anything already copied is kept.",
    blocked_by_policy:"Your organization's settings block Jobber here.",
    quota_exceeded:"Gilco Jobs storage is full, so the import stopped.",
    invalid_argument:"You can view this app but not add to it, so nothing was imported."};
  return m[e?.code]||("The import stopped: "+(e?.message||"unknown problem")+". Anything already copied is kept; try again to finish.");
}
async function runImport(){
  const brand=$("#imp-brand").value,doC=$("#imp-c").checked,doP=$("#imp-p").checked;
  const log=m=>{S.imp.log=m;const el=$("#imp-log");if(el){el.hidden=false;el.textContent=m}};
  S.imp={brand,c:doC,p:doP,running:true,log:""};renderSheet();
  if(!doC&&!doP){S.imp.running=false;renderSheet();log("Tick Clients, Price Book or both.");return}
  if(!S.db){S.imp.running=false;renderSheet();log("Importing needs saving, which this view doesn't have. Open Gilco Jobs full screen from your artifacts and try again.");return}
  log("Connecting to Jobber…");
  const mcp=await (window.claude?.use?.("mcp")??null);
  if(!mcp){S.imp.running=false;renderSheet();log("Jobber can't be reached from this view. Open Gilco Jobs full screen from your artifacts and try again.");return}
  S.importing=true;const done=[];
  try{
    if(doC){
      const list=await readAll(mcp,"search_clients","clients",100,n=>log(`Reading clients from Jobber… ${n}`));
      const have=new Set(S.data.clients.map(x=>x.id));
      const todo=list.filter(c=>!c.isArchived).map(c=>[jbId(c.id),clientFromJobber(c,brand)]).filter(([id])=>!have.has(id));
      await writeAll("clients",todo,n=>log(`Saving clients… ${n} of ${todo.length}`));
      done.push(`${todo.length} new client${todo.length===1?"":"s"}`+(list.length-todo.length?` (${list.length-todo.length} skipped: already here or archived)`:""));
    }
    if(doP){
      const list=await readAll(mcp,"search_products_and_services","productsAndServices",50,n=>log(`Reading Price Book from Jobber… ${n}`));
      const have=new Set(S.data.pricebook.map(x=>x.id));
      const todo=list.filter(p=>p.active!==false).map(p=>[jbId(p.id),itemFromJobber(p)]).filter(([id])=>!have.has(id));
      await writeAll("pricebook",todo,n=>log(`Saving Price Book… ${n} of ${todo.length}`));
      done.push(`${todo.length} new Price Book item${todo.length===1?"":"s"}`+(list.length-todo.length?` (${list.length-todo.length} already here)`:""));
    }
    S.imp.log="Done. Added "+done.join(" and ")+".";
  }catch(e){S.imp.log=(done.length?"Added "+done.join(" and ")+". ":"")+importErr(e)}
  S.importing=false;S.imp.running=false;
  const keep=S.sheet;S.sheet=null;render();S.sheet=keep;renderSheet();
}

  const d=S.draft,t=$("#tot");if(!t)return;

  else t.innerHTML=totalsBox(d);
  (d.items||[]).forEach((l,i)=>{const a=document.querySelector(`[data-amt="${i}"]`);if(a)a.innerHTML=lineProfitHtml(l)+money(lineAmt(l))});
}

const COLOF={client:"clients",quote:"quotes",job:"jobs",invoice:"invoices",item:"pricebook",kit:"kits"};
function validate(){
  const d=S.draft,t=S.sheet.type;
  if(t==="client"&&!d.name.trim())return "Add the client's name";
  if(t==="item"&&!d.name.trim())return "Add an item name";
  if(t==="quote"&&!d.clientId)return "Choose a client";
  if((t==="job")&&!d.title.trim())return "Add a job title";
  return null;
}
async function doSave(close=true){
  const err=validate();if(err){toast(err);return false}
  const d=S.draft;
  if(S.sheet.type==="item"){
    const mk=v=>blank(v)?"":Number(v);
    normItem(d);
    d.subCosts=(d.subCosts||[]).filter(s=>s.installer).map(s=>({installer:s.installer,cost:num(s.cost)}));

/* ---------- dispatch calendar ---------- */
const SLOTS=[["am","Morning"],["pm","Afternoon"],["day","All day"]];

function monday(d){const x=new Date(d+"T12:00:00");const k=(x.getDay()+6)%7;return addDays(d,-k)}
function dayLbl(d,o){return new Date(d+"T12:00:00").toLocaleDateString("en-US",o||{weekday:"short",month:"numeric",day:"numeric"})}
function jobDays(j){const n=Math.max(1,Number(j.days)||1);return Array.from({length:n},(_,i)=>addDays(j.start,i))}
function crewList(){return [...new Set([...(S.installers||[]).map(x=>x.name).filter(Boolean),...S.data.jobs.map(j=>j.crew).filter(Boolean)])]}
function jobChip(j,d){const i=jobDays(j).indexOf(d),n=jobDays(j).length;return `<button class="jchip b-${esc(j.brand||"")}" data-act="sched" data-id="${j.id}"><span class="jt">${esc(j.title||"Untitled")}</span><span class="js">${esc(slotName(j.slot))}${n>1?` · day ${i+1} of ${n}`:""}${j.crew?" · "+esc(j.crew):""}</span><span class="js">${esc(clientName(j.clientId))}</span></button>`}
function calHtml(js){
  const t=today();S.calStart=S.calStart||monday(t);if(!S.calDay)S.calDay=t;
  const days=Array.from({length:7},(_,i)=>addDays(S.calStart,i));if(!days.includes(S.calDay))S.calDay=days[0];

  const on=d=>live.filter(j=>j.start&&jobDays(j).includes(d)).sort((a,b)=>"am pm day".indexOf(a.slot||"day")-"am pm day".indexOf(b.slot||"day"));

  return `<div class="calnav"><button data-act="calmove" data-v="-7" aria-label="Previous week">‹</button><button data-act="calmove" data-v="0">Today</button><button data-act="calmove" data-v="7" aria-label="Next week">›</button><b>${dayLbl(days[0],{month:"short",day:"numeric"})} – ${dayLbl(days[6],{month:"short",day:"numeric"})}</b></div>
  ${un.length?`<div class="tray"><div class="muted small">Not scheduled yet · tap to schedule</div><div class="trayl">${un.map(j=>`<button class="jchip b-${esc(j.brand||"")}" data-act="sched" data-id="${j.id}"><span class="jt">${esc(j.title||"Untitled")}</span><span class="js">${esc(clientName(j.clientId))}</span></button>`).join("")}</div></div>`:""}
  <div class="daystrip">${days.map(d=>`<button data-act="calday" data-v="${d}" aria-pressed="${d===S.calDay}" class="${d===t?"today":""}"><span>${dayLbl(d,{weekday:"short"})}</span><b>${dayLbl(d,{day:"numeric"})}</b><i>${on(d).length||""}</i></button>`).join("")}</div>
  <div class="cal">${days.map(d=>{const l=on(d);return `<div class="cday ${d===S.calDay?"sel":""} ${d===t?"today":""}"><div class="cdh">${dayLbl(d)}</div>${l.map(j=>jobChip(j,d)).join("")||`<div class="muted small cempty">Open</div>`}</div>`}).join("")}</div>`;
}

function csvCell(v){v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}

function qbCsv(){const H=["InvoiceNo","Customer","InvoiceDate","DueDate","Memo","Item(Product/Service)","ItemDescription","ItemQuantity","ItemRate","ItemAmount","ItemTaxAmount"];const out=[H.join(",")];
  qbRows().forEach(i=>{const t=totals(i);const ls=(i.items||[]).filter(lineOn);ls.forEach((l,k)=>{const amt=lineAmt(l);out.push([i.number,clientName(i.clientId),mdy(invDate(i)),mdy(i.dueDate),i.title||"",String(l.name||"Service").slice(0,100),l.desc||"",l.unit==="ls"?1:l.qty,l.unit==="ls"?amt:l.price,amt,k===0?t.tax:0].map(csvCell).join(","))})});return out.join("\r\n")}

       if(keep&&c!==COLOF[keep.type])renderSheet();}
    },()=>{S.loaded.add(c);toast("Some data couldn't load. Refresh to try again.");render()});
  });
})();
</script>
